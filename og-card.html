<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Card — Anthony Maitz</title>
  <style>
    @font-face {
      font-family: 'Lora';
      src: url('/fonts/lora-normal-latin.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Lora';
      src: url('/fonts/lora-italic-latin.woff2') format('woff2');
      font-weight: 400 700;
      font-style: italic;
    }
    @font-face {
      font-family: 'Work Sans';
      src: url('/fonts/work-sans-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
      font-family: 'Work Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Blob background ── */
    .blobs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.18;
      background: radial-gradient(circle, rgba(255,60,110,1) 0%, rgba(255,140,50,0.8) 35%, transparent 45%);
    }
    .blob-1 {
      width: 1080px; height: 1080px;
      top: -315px; left: -480px;
      filter: blur(90px) hue-rotate(0deg);
    }
    .blob-2 {
      width: 960px; height: 1080px;
      bottom: -283px; right: -420px;
      filter: blur(90px) hue-rotate(120deg);
    }
    .blob-3 {
      width: 960px; height: 960px;
      top: 157px; left: 60px;
      filter: blur(90px) hue-rotate(240deg);
    }

    /* ── Layout ── */
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
    }

    .left {
      width: 520px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 56px 0 72px;
      position: relative;
      z-index: 1;
    }

    .right {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .right img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* ── Typography ── */
    .name {
      font-family: 'Lora', Georgia, serif;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.1;
      color: #5B7B93;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      white-space: nowrap;
    }
    .title {
      font-family: 'Work Sans', sans-serif;
      font-size: 24px;
      font-weight: 400;
      color: #333333;
      line-height: 1.3;
      margin-bottom: 24px;
      white-space: nowrap;
    }
    .divider {
      width: 360px;
      height: 1px;
      background: #e0e0e0;
      margin-bottom: 22px;
    }
    .url {
      font-family: 'Work Sans', sans-serif;
      font-size: 19px;
      font-weight: 400;
      color: #666666;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="left">
      <div class="name">Anthony Maitz</div>
      <div class="title">Product Manager &amp; Game Designer</div>
      <div class="divider"></div>
      <div class="url">anthony.maitz.work</div>
    </div>
    <div class="right">
      <img src="/Anthony_Profile_cutout.png" alt="Anthony Maitz">
    </div>
  </div>
</body>
</html>
